[project]
name = "agent-context-server"
version = "0.1.0"
description = "Local MCP context memory with SQLite and clingo inference"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "clingo>=5.8,<6"]

[project.scripts]
context-server = "context_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_server"]

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "src/**/*.py"}]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "coverage>=7,<8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["context_server"]

[tool.coverage.report]
show_missing = true
# Leaves room for the reasoner's unreachable "no model" branch and the __main__ guard.
fail_under = 95
