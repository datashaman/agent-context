[project]
name = "agent-context-server"
version = "0.1.0"
description = "Local MCP context memory with SQLite and clingo inference"
requires-python = ">=3.13"
dependencies = ["mcp>=1.26,<2", "clingo>=5.8,<6"]

[project.scripts]
context-server = "context_server.server:main"
agent-context = "context_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_server"]

[tool.uv]
# Installs are non-editable (--no-editable) so a running server and the reasoner subprocess it
# spawns per infer() always use the same code, even while the checkout is being edited.
# cache-keys make uv rebuild that install whenever the source changes.
cache-keys = [{file = "pyproject.toml"}, {file = "src/**/*.py"}]

[dependency-groups]
dev = ["pytest>=8,<10", "coverage>=7,<8"]  # async tests use the anyio plugin that ships with mcp

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["context_server"]

[tool.coverage.report]
show_missing = true
fail_under = 100
