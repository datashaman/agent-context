name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-editable --locked --python ${{ matrix.python }}
      - run: uv run --no-editable --locked coverage run -m pytest -q
      - run: uv run --no-editable --locked coverage report
      - run: uv build
